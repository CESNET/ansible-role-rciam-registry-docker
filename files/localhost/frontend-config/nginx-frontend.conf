server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        # Let's encrypt webroot certificate obtaining method
        root /var/www/federation_registry_frontend/;
    }
    location / {
        # Redirect all HTTP requests to HTTPS
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;
    http2 on;

    ssl_certificate /etc/ssl/certs/federation-registry-cert.pem;
    ssl_certificate_key /etc/ssl/private/federation-registry-key.pem;

    root /var/www/federation_registry_frontend/;

    index index.html;

    location = / {
        return 302 /cesnet/home; # temporary redirect (302) to allow hostname reuse. cesnet = your tenant name
#         add_header Strict-Transport-Security "max-age=63072000; includeSubDomains";
    }

    location / {
        try_files $uri $uri/ /index.html;
#        gzip on;
#        gzip_min_length 1000;
#        gzip_types application/javascript text/css image/svg+xml;
#        gzip_vary on;
#        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains";

    }

    location /static/ {
        gzip_static on;
        gzip_vary on;
#        expires 7d;
    }

    location /img {
        gzip_static on;
        gzip_vary on;
#        expires 7d;
    }

    location = /ams_verification_hash {
  	    return 302 /federation-backend/ams/ams_verification_hash;
    }

    location = /federation-backend {
        return 301 /federation-backend/;
    }

    location /federation-backend/ {
        rewrite ^/federation-backend/(.*) /$1 break;
        proxy_set_header Host $host;
        proxy_pass http://rciam-backend-api;
        proxy_http_version 1.1;
        proxy_next_upstream off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_connect_timeout 2s;
#        gzip on;
#        gzip_min_length 1000;
#        gzip_proxied any;
#        gzip_types application/json;
#        gzip_vary on;
        # Do not allow X-Api-Key usage for proxied requests, API clients connect directly to the backend-api, not via NGINX
        proxy_set_header X-Api-Key "";
        proxy_max_temp_file_size 0;
    }
}

upstream rciam-backend-api {
    keepalive 3;
    zone rciam-backend-api 32k;
    server [fd77:fed:bac::80]:5000;
}