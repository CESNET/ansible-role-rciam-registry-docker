---
deployment_id: localhost # Update to your specific deployment ID
base_uri: "https://{{ deployment_id }}" # without tailing /
tenant_name: tenant_name
backend_env: dev
db_config:
  host: host.docker.internal
  port: 5432
  database: federation_registry
  user: federation_registry
  password: mystery_but_not_so_secret
  sslmode: verify-full

rabbitmq-agent_rabbitmq_password: romaine_lettuce
# created with rabbitmqctl hash_password
rabbitmq_agent_rabbitmq_hash: vhiaqIlTf9QQ1a7Sl7C6uUioKAao2U1Fgi/mQDMjsFZvfnF5
deployer_rabbitmq_password: happy_rabbit1
# created with rabbitmqctl hash_password:
deployer_rabbitmq_hash: cFANbvHXlz6M9Atzs6C/mXnYyR04Cwz1MaPz77+xR1LoEC+Y

# defaults file for cesnet.federation_registry
federation_registry_config_path: /etc/rciam-registry/
federation_registry_data_path: /var/lib/rciam-registry/
federation_registry_log_path: /var/log/rciam-registry/
federation_registry_dirs:
  - { path: "{{ federation_registry_config_path }}/frontend-config", owner: "root", group: 101, mode: "0750" }
  - { path: "{{ federation_registry_config_path }}/frontend-config/.well-known", owner: "root", group: 101, mode: "0750" }
  - { path: "{{ federation_registry_config_path }}/backend-config", owner: "root", group: "root", mode: "0750" }
  - { path: "{{ federation_registry_config_path }}/rabbitmq-agent", owner: "root", group: "root", mode: "0750" }
  - { path: "{{ federation_registry_config_path }}/rabbitmq", owner: "root", group: 415, mode: "0750" }
  - { path: "{{ federation_registry_config_path }}/deployer", owner: "root", group: 1000, mode: "0750" }
  - { path: "{{ federation_registry_log_path }}", owner: "root", group: 1000, mode: "0750" }
  - { path: "{{ federation_registry_log_path }}/backend-api", owner: "root", group: 1000, mode: "0750" }
  - { path: "{{ federation_registry_data_path }}", owner: "root", group: 1000, mode: "0750" }
  - { path: "{{ federation_registry_data_path }}/rabbitmq", owner: 415, group: 415, mode: "0700" } # rabbitmq user in container


federation_registry_files:
  - { src: "files/{{ deployment_id }}/backend-config", dest: "{{ federation_registry_config_path }}", owner: "root", group: 1000, mode: "0640" }
  - { src: "files/{{ deployment_id }}/frontend-config", dest: "{{ federation_registry_config_path }}", owner: "root", group: 101, mode: "0640" }
  - { src: "files/{{ deployment_id }}/deployer", dest: "{{ federation_registry_config_path }}", owner: "root", group: 1000, mode: "0640" }

federation_registry_templates: # without .j2, ensure the destination is file (not directory).
  - { src: "templates/backend-config/db-config.json", dest: "{{ federation_registry_config_path }}/backend-config/db-config.json", group: 1000, mode: "0640" }
  - { src: "templates/backend-config/.env", dest: "{{ federation_registry_config_path }}/backend-config/.env", group: 1000, mode: "0640" }
  - { src: "templates/compose.yaml", dest: "{{ federation_registry_config_path }}/compose.yaml", mode: "0640" }
  - { src: "templates/rabbitmq/rabbitmq.conf", dest: "{{ federation_registry_config_path }}/rabbitmq/rabbitmq.conf", group: 415, mode: "0640" }
  - { src: "templates/rabbitmq/initial-state-definitions.json", dest: "{{ federation_registry_config_path }}/rabbitmq/initial-state-definitions.json", group: 415, mode: "0640" }


federation_registry_deployers: []
#   - name: cas_rabbitmq
#     config_dir: "files/{{ deployment_id }}/deployer/cas_rabbitmq"

federation_registry_rabbitmq_agents: []
#  - name: rabbitmq_agent_one
#    config: "files/{{ deployment_id }}/rabbitmq-agent/rabbitmq_agent_one_config.json"