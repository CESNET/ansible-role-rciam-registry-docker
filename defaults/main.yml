---
deployment_id: localhost # Update to your specific deployment ID
base_uri: "https://{{ deployment_id }}" # without tailing /
tenant_name: tenant_name
backend_env: dev
db_config:
  host: host.docker.internal
  port: 5432
  database: federation_registry
  user: federation_registry
  password: mystery_but_not_so_secret
  sslmode: verify-full

rabbitmq-agent_rabbitmq_password: romaine_lettuce
# created with rabbitmqctl hash_password
rabbitmq_agent_rabbitmq_hash: vhiaqIlTf9QQ1a7Sl7C6uUioKAao2U1Fgi/mQDMjsFZvfnF5
deployer_rabbitmq_password: happy_rabbit1
# created with rabbitmqctl hash_password:
deployer_rabbitmq_hash: cFANbvHXlz6M9Atzs6C/mXnYyR04Cwz1MaPz77+xR1LoEC+Y

# defaults file for cesnet.federation_registry
federation_registry_build_containers: false # true -> build locally, instead of downloading from the registry
federation_registry_config_path: /etc/rciam-registry/
federation_registry_data_path: /var/lib/rciam-registry/
federation_registry_log_path: /var/log/rciam-registry/
federation_registry_dirs:
  - { path: "{{ federation_registry_config_path }}/frontend", owner: "root", group: "frontend", mode: "0750" }
  - { path: "{{ federation_registry_config_path }}/frontend/.well-known", owner: "root", group: "frontend", mode: "0750" }
  - { path: "{{ federation_registry_config_path }}/backend-api", owner: "root", group: "backend-api", mode: "0750" }
  - { path: "{{ federation_registry_config_path }}/rabbitmq-agent", owner: "root", group: "rabbitmq-agent", mode: "0750" }
  - { path: "{{ federation_registry_config_path }}/rabbitmq", owner: "root", group: "rabbitmq", mode: "0750" }
  - { path: "{{ federation_registry_config_path }}/deployer", owner: "root", group: "deployer", mode: "0750" }
  - { path: "{{ federation_registry_log_path }}", owner: "root", group: "root", mode: "0750" }
  - { path: "{{ federation_registry_log_path }}/backend-api", owner: "root", group: "backend-api", mode: "0750" }
  - { path: "{{ federation_registry_data_path }}", owner: "root", group: "root", mode: "0755" }
  - { path: "{{ federation_registry_data_path }}/rabbitmq", owner: "rabbitmq", group: "rabbitmq", mode: "0700" }

federation_registry_deployers: []
