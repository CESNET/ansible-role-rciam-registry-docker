---
- name: Create users
  ansible.builtin.user:
    name: "{{ item.name }}"
    uid: "{{ item.uid }}"
    shell: /usr/sbin/nologin
    create_home: no
    home: "/etc/rciam-registry/{{ item.name }}"
    system: true

  with_list:
    - name: frontend
      uid: 743
    - name: backend-api
      uid: 780
    - name: rabbitmq-agent
      uid: 728
    - name: rabbitmq
      uid: 756
    - name: deployer
      uid: 712

- name: Create directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
    mode: "{{ item.mode | default('0755') }}"
    state: directory
  loop: "{{ federation_registry_dirs }}"

- name: Ensure log file exists for the backend-api
  ansible.builtin.file:
    access_time: preserve
    modification_time: preserve
    path: "{{ federation_registry_log_path }}/backend-api-errors.log"
    state: touch
    owner: backend-api
    mode: "0750"

- name: Copy files
  # Copying files in individual tasks to run only the required handlers
  block:
    - name: Copy files for frontend
      ansible.builtin.copy:
        src: "files/{{ deployment_id }}/frontend"
        dest: "{{ federation_registry_config_path }}"
        owner: root
        group: frontend
        mode: "0640"
      notify: Reload NGINX in frontend

    - name: Copy files for backend-api
      ansible.builtin.copy:
        src: "files/{{ deployment_id }}/backend-api"
        dest: "{{ federation_registry_config_path }}"
        owner: "root"
        group: backend-api
        mode: "0640"
      notify: Restart backend-api

    - name: Copy templates for backend-api
      ansible.builtin.template:
        src: "{{ item.src }}.j2"
        dest: "{{ item.dest | default(item.src) }}"
        owner: "{{ item.owner | default('root') }}"
        group: "{{ item.group | default('backend-api') }}"
        mode: "{{ item.mode | default('0640') }}"
      notify: Restart backend-api
      with_list:
        - src: "templates/backend-api/db-config.json"
          dest: "{{ federation_registry_config_path }}/backend-api/db-config.json"
        - src: "templates/backend-api/.env"
          dest: "{{ federation_registry_config_path }}/backend-api/.env"

    - name: Copy files for deployer
      ansible.builtin.copy:
        src: "files/{{ deployment_id }}/deployer"
        dest: "{{ federation_registry_config_path }}"
        owner: "root"
        group: deployer
        mode: "0640"
      notify: Restart deployers
      when: federation_registry_deployers | length > 0

    - name: Copy template for rabbitmq.conf
      ansible.builtin.template:
        src: templates/rabbitmq/rabbitmq.conf.j2
        dest: "{{ federation_registry_config_path }}/rabbitmq/rabbitmq.conf"
        owner: root
        group: rabbitmq
        mode: 0640
      notify: Restart rabbitmq

    - name: Copy template for RabbitMQ definitions
      ansible.builtin.template:
        src: templates/rabbitmq/definitions.json.j2
        dest: "{{ federation_registry_config_path }}/rabbitmq/definitions.json"
        owner: root
        group: rabbitmq
        mode: 0640
      notify: rabbitmqctl import_definitions

    - name: Copy files for RabbitMQ agents
      ansible.builtin.copy:
        src: "{{ item.config }}"
        dest: "{{ item.config_dest | default([federation_registry_config_path, 'rabbitmq-agent'] | join('/')) }}"
        owner: "{{ item.owner | default('root') }}"
        group: "{{ item.group | default('rabbitmq-agent') }}"
        mode: "{{ item.mode | default('0644') }}"
      notify: Restart rabbitmq-agents
      with_list: "{{ federation_registry_rabbitmq_agents }}"

    - name: Copy compose.yaml
      ansible.builtin.template:
        src: "templates/compose.yaml.j2"
        dest: "{{ federation_registry_config_path }}/compose.yaml"
        mode: "0640"

    - name: Copy Dockerfiles
      ansible.builtin.copy:
        src: files/docker/
        dest: /var/lib/rciam-registry/
        mode: 0755
      when: federation_registry_build_containers
  tags:
    - configuration

- name: docker compose up
  community.docker.docker_compose_v2:
    project_src: "{{ federation_registry_config_path }}"
    state: present
    remove_orphans: true
    build: "{{ 'always' if federation_registry_build_containers else 'never' }}"
    pull: "{{ 'always' if not federation_registry_build_containers else 'never' }}"
    wait: true
  register: docker_compose_status
  tags:
    - configuration

- name: Show containers, restarted by docker compose up
  ansible.builtin.debug:
    msg: "{{ docker_compose_status | community.general.json_query('actions[?status==`Recreate`].id') }}"
  ignore_errors: "{{ ansible_check_mode }}"
  when: docker_compose_status is defined and docker_compose_status | community.general.json_query('actions[?status==`Recreate`].id') != []
  changed_when: docker_compose_status | community.general.json_query('actions[?status==`Recreate`].id') != []
  tags:
    - configuration

- name: flush handlers
  meta: flush_handlers